name: Release

# Tag push "v*" -> tests -> build -> PyPI -> GitHub Release.
# Zenodo archives the GitHub Release through the repository's Zenodo GitHub
# integration (metadata from .zenodo.json); no Zenodo token is needed here.
# First release (v0.2.0) uploads with the repository secret PYPI_API_TOKEN
# (Johann, 2026-11-17: first upload with token, as usual). Afterwards Johann
# registers Trusted Publishing (owner GenesisAeon, repo aeon-jurist,
# workflow release.yml, no environment); then switch to OIDC and drop the
# token, as in SCF.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import aeon_jurist as a; print(a.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Case data must be inside the wheel
        run: unzip -l dist/*.whl | grep -q "aeon_jurist/data/precedents_v2.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (API token)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
