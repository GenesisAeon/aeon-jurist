[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeon-jurist"
version = "0.2.0"
description = "AI-assisted legal personhood classification for ecological and AI entities (GenesisAeon P55)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann", email = "joberoemer@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "legal-personhood",
    "TF-IDF",
    "rights-of-nature",
    "ecological-rights",
    "CREP",
    "GenesisAeon",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "diamond-setup>=2.2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/GenesisAeon/aeon-jurist"
Repository = "https://github.com/GenesisAeon/aeon-jurist"
Issues = "https://github.com/GenesisAeon/aeon-jurist/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aeon_jurist"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aeon_jurist --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
ignore_missing_imports = true
